<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #fdf6e3;
        --accent: #f2c14e;
        --font-display: "Archivo Black";
        --font-body: "Outfit";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #footage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .card {
        position: absolute; left: 50%; top: 330px; transform: translateX(-50%); width: max-content; max-width: 1536px;
        padding: 40px 72px 48px; border-radius: 28px; background: rgba(0, 0, 0, 0.5);
        display: flex; flex-direction: column; align-items: center; text-align: center;
        color: var(--ink); text-shadow: 0 4px 28px rgba(0, 0, 0, 0.6);
      }
      .card.on-black { background: none; text-shadow: none; }
      .card.on-black .kicker { margin-top: 18px; color: var(--accent); }
      .kicker { font-family: var(--font-body); font-weight: 600; font-size: 38px; letter-spacing: 0.3em; text-transform: uppercase; }
      .big { font-family: var(--font-display); font-size: 132px; line-height: 1.02; margin-top: 14px; text-wrap: balance; }
      .section { position: absolute; left: 160px; top: 110px; }
      .section span {
        display: inline-block; font-family: var(--font-body); font-weight: 700; font-size: 44px;
        color: var(--ink); padding: 10px 26px; border-left: 6px solid var(--accent);
        background: rgba(0, 0, 0, 0.45); letter-spacing: 0.04em;
      }
      .caption { position: absolute; left: 192px; top: 860px; width: 1536px; text-align: center; }
      .caption span {
        display: inline-block; font-family: var(--font-body); font-weight: 700; font-size: 50px; line-height: 1.25;
        color: #fff; padding: 8px 22px; border-radius: 12px; background: rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="271.198" data-width="1920" data-height="1080">
      <video id="footage" class="clip" src="assets/vlog_base.mp4" data-start="0" data-duration="271.198" data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="title" class="card clip" data-start="12.605" data-duration="6.571" data-track-index="1"><div id="title-kicker" class="kicker">North Luzon · Weekend Youth Camp 2026</div><div id="title-big" class="big">Chosen Gen</div></div>
      <div id="outro" class="card on-black clip" data-start="263.145" data-duration="8.053" data-track-index="1"><div id="outro-big" class="big">Chosen Gen</div><div id="outro-kicker" class="kicker">until next camp ✦</div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rise = { opacity: 0, y: 40, filter: "blur(8px)" };
      const land = { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" };
      tl.fromTo("#title-kicker", rise, { ...land }, 12.805);
      tl.fromTo("#title-big", rise, { ...land }, 12.955);
      tl.to(["#title-kicker", "#title-big"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 18.676000000000002);
      tl.fromTo("#outro-kicker", rise, { ...land }, 263.445);
      tl.fromTo("#outro-big", rise, { ...land }, 263.59499999999997);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
