<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #fdf6e3;
        --accent: #f2c14e;
        --font-display: "Archivo Black";
        --font-body: "Outfit";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #footage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .card {
        position: absolute; left: 50%; top: 330px; transform: translateX(-50%); width: max-content; max-width: 1536px;
        padding: 40px 72px 48px; border-radius: 28px; background: rgba(0, 0, 0, 0.5);
        display: flex; flex-direction: column; align-items: center; text-align: center;
        color: var(--ink); text-shadow: 0 4px 28px rgba(0, 0, 0, 0.6);
      }
      .kicker { font-family: var(--font-body); font-weight: 600; font-size: 38px; letter-spacing: 0.3em; text-transform: uppercase; }
      .big { font-family: var(--font-display); font-size: 132px; line-height: 1.02; margin-top: 14px; text-wrap: balance; }
      .section { position: absolute; left: 160px; top: 110px; }
      .section span {
        display: inline-block; font-family: var(--font-body); font-weight: 700; font-size: 44px;
        color: var(--ink); padding: 10px 26px; border-left: 6px solid var(--accent);
        background: rgba(0, 0, 0, 0.45); letter-spacing: 0.04em;
      }
      .caption { position: absolute; left: 192px; top: 860px; width: 1536px; text-align: center; }
      .caption span {
        display: inline-block; font-family: var(--font-body); font-weight: 700; font-size: 50px; line-height: 1.25;
        color: #fff; padding: 8px 22px; border-radius: 12px; background: rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="199.8" data-width="1920" data-height="1080">
      <video id="footage" class="clip" src="assets/vlog_base.mp4" data-start="0" data-duration="199.8" data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="title" class="card clip" data-start="3.6" data-duration="4.5" data-track-index="1"><div id="title-kicker" class="kicker">North Luzon · Weekend Youth Camp 2026</div><div id="title-big" class="big">Chosen Gen</div></div>
      <div id="outro" class="card clip" data-start="194.3" data-duration="5.5" data-track-index="1"><div id="outro-kicker" class="kicker">Chosen Gen</div><div id="outro-big" class="big">until next camp ✦</div></div>
      <div id="sec2" class="section clip" data-start="8.1" data-duration="2.8" data-track-index="2"><span id="sec2-t">April 29 · the night before</span></div>
      <div id="sec7" class="section clip" data-start="23.1" data-duration="2.8" data-track-index="2"><span id="sec7-t">April 30</span></div>
      <div id="sec21" class="section clip" data-start="65.1" data-duration="2.8" data-track-index="2"><span id="sec21-t">bonfire night</span></div>
      <div id="sec27" class="section clip" data-start="110.2" data-duration="2.8" data-track-index="2"><span id="sec27-t">May 1</span></div>
      <div id="sec32" class="section clip" data-start="125.2" data-duration="2.8" data-track-index="2"><span id="sec32-t">May 2</span></div>
      <div id="sec47" class="section clip" data-start="178.1" data-duration="2.8" data-track-index="2"><span id="sec47-t">May 3 · last day</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rise = { opacity: 0, y: 40, filter: "blur(8px)" };
      const land = { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" };
      tl.fromTo("#title-kicker", rise, { ...land }, 3.8000000000000003);
      tl.fromTo("#title-big", rise, { ...land }, 3.95);
      tl.to(["#title-kicker", "#title-big"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 7.6);
      tl.fromTo("#outro-kicker", rise, { ...land }, 194.60000000000002);
      tl.fromTo("#outro-big", rise, { ...land }, 194.75);
      tl.fromTo("#sec2-t", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 8.2);
      tl.to("#sec2-t", { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.549999999999999);
      tl.fromTo("#sec7-t", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 23.200000000000003);
      tl.to("#sec7-t", { opacity: 0, duration: 0.3, ease: "power2.in" }, 25.55);
      tl.fromTo("#sec21-t", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 65.19999999999999);
      tl.to("#sec21-t", { opacity: 0, duration: 0.3, ease: "power2.in" }, 67.55);
      tl.fromTo("#sec27-t", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 110.3);
      tl.to("#sec27-t", { opacity: 0, duration: 0.3, ease: "power2.in" }, 112.65);
      tl.fromTo("#sec32-t", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 125.3);
      tl.to("#sec32-t", { opacity: 0, duration: 0.3, ease: "power2.in" }, 127.65);
      tl.fromTo("#sec47-t", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 178.2);
      tl.to("#sec47-t", { opacity: 0, duration: 0.3, ease: "power2.in" }, 180.55);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
